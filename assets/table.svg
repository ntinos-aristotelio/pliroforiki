<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="Word: Πίνακες">
<style>
.bg{fill:#f7fbff} .paper{fill:#fff;stroke:#dce5f1;stroke-width:2} .bar{fill:#eef4fb} .tab{fill:#2563eb} .tabtxt{fill:#fff;font:bold 18px Arial} .txt{font:700 30px Arial;fill:#10233f} .sub{font:18px Arial;fill:#4b5b72} .label{font:bold 18px Arial;fill:#10233f} .small{font:15px Arial;fill:#25324a} .step{font:18px Arial;fill:#14213d} .dot{fill:#2563eb} .num{font:bold 16px Arial;fill:#fff} .hi{fill:none;stroke:#f59e0b;stroke-width:6;stroke-linecap:round;stroke-dasharray:8 8} .arrow{stroke:#f59e0b;stroke-width:5;marker-end:url(#arr)} .hint{font:bold 20px Arial;fill:#b45309}
</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#f59e0b"/></marker></defs>
<rect width="900" height="540" rx="28" class="bg"/>
<text x="40" y="52" class="txt">Word: Πίνακες</text><text x="40" y="82" class="sub">Για ύψος γραμμών, διαγραφή γραμμών/στηλών, σκίαση και περιγράμματα πίνακα</text>
<rect x="40" y="112" width="820" height="210" rx="18" class="paper"/>
<rect x="40" y="112" width="820" height="52" rx="18" class="bar"/><rect x="66" y="124" width="128" height="30" rx="8" class="tab"/><text x="130" y="146" text-anchor="middle" class="tabtxt">Εργαλεία Πίνακα</text>
<rect x="228" y="180" width="392" height="112" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="424" y="209" text-anchor="middle" class="label">Σχεδίαση / Διάταξη</text>
<rect x="242" y="223" width="78" height="38" rx="8" fill="#ffffff" stroke="#cdd7e5" stroke-width="1.5"/><text x="281.0" y="247.0" text-anchor="middle" class="small">Επιλογή</text><rect x="328" y="223" width="66" height="38" rx="8" fill="#ffffff" stroke="#cdd7e5" stroke-width="1.5"/><text x="361.0" y="247.0" text-anchor="middle" class="small">Ύψος</text><rect x="402" y="223" width="86" height="38" rx="8" fill="#ffffff" stroke="#cdd7e5" stroke-width="1.5"/><text x="445.0" y="247.0" text-anchor="middle" class="small">Διαγραφή</text><rect x="496" y="223" width="80" height="38" rx="8" fill="#ffffff" stroke="#cdd7e5" stroke-width="1.5"/><text x="536.0" y="247.0" text-anchor="middle" class="small">Σκίαση</text><rect x="220" y="172" width="408" height="128" rx="20" class="hi"/><path d="M424 330 L424 295" class="arrow"/><text x="456" y="342" class="hint">εδώ κοιτάμε</text><g opacity=".95"><rect x="665" y="185" width="145" height="95" rx="8" fill="#fff" stroke="#94a3b8"/><path d="M665 217H810M665 249H810M713 185V280M762 185V280" stroke="#94a3b8"/><rect x="665" y="185" width="145" height="32" fill="#dbeafe" opacity=".8"/></g>
<circle cx="54" cy="355" r="15" class="dot"/><text x="54" y="360" text-anchor="middle" class="num">1</text><text x="80" y="360" class="step">Κάνω κλικ μέσα στον πίνακα</text><circle cx="54" cy="391" r="15" class="dot"/><text x="54" y="396" text-anchor="middle" class="num">2</text><text x="80" y="396" class="step">Εμφανίζονται τα Εργαλεία Πίνακα</text><circle cx="54" cy="427" r="15" class="dot"/><text x="54" y="432" text-anchor="middle" class="num">3</text><text x="80" y="432" class="step">Διαλέγω Σχεδίαση ή Διάταξη</text><circle cx="54" cy="463" r="15" class="dot"/><text x="54" y="468" text-anchor="middle" class="num">4</text><text x="80" y="468" class="step">Εφαρμόζω σε γραμμή, στήλη ή όλο τον πίνακα</text>
</svg>