<svg xmlns="http://www.w3.org/2000/svg" width="450" height="211" viewBox="0 0 450 211" role="img" aria-label="Καρτέλα Διάταξη στο Word με Περιθώρια, Προσανατολισμό, Μέγεθος και Στήλες">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .ui{font-family:'Segoe UI',Arial,sans-serif;fill:#222}.muted{fill:#777}.tab{font-size:14px}.label{font-size:12px}.small{font-size:12px}.group{font-size:12px;fill:#444}.blue{fill:#3b88d9}.line{stroke:#d5d5d5;stroke-width:1}.iconLine{stroke:#222;stroke-width:1.2;fill:none}.drop{font-size:12px;fill:#333}
    </style>
  </defs>
  <rect width="450" height="211" fill="#f3f3f3"/>
  <rect x="0" y="0" width="450" height="40" fill="#f7f7f7"/>
  <rect x="18" y="14" width="18" height="18" rx="2" fill="#1f78d1"/>
  <text x="23" y="28" font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="white">W</text>
  <text x="48" y="27" class="ui muted small">Αυτόματη αποθήκευση</text>
  <rect x="160" y="12" width="44" height="22" rx="11" fill="white" stroke="#777"/>
  <circle cx="176" cy="23" r="9" fill="#555"/>
  <rect x="226" y="12" width="15" height="15" fill="none" stroke="#777"/>
  <text x="259" y="27" class="ui muted small">Έγγραφο1 - Word</text>

  <rect x="0" y="40" width="450" height="36" fill="#f7f7f7"/>
  <text x="10" y="66" class="ui tab">Αρχείο</text>
  <text x="70" y="66" class="ui tab">Κεντρική</text>
  <text x="145" y="66" class="ui tab">Εισαγωγή</text>
  <text x="228" y="66" class="ui tab">Σχεδίαση</text>
  <text x="304" y="66" class="ui tab" font-weight="700">Διάταξη</text>
  <text x="382" y="66" class="ui tab">Αναφορές</text>
  <line x1="305" y1="73" x2="363" y2="73" stroke="#1b66c9" stroke-width="3"/>

  <rect x="7" y="77" width="436" height="92" rx="8" fill="#fff" filter="url(#softShadow)"/>
  <line x1="86" y1="84" x2="86" y2="160" class="line"/>
  <line x1="184" y1="84" x2="184" y2="160" class="line"/>
  <line x1="252" y1="84" x2="252" y2="160" class="line"/>
  <line x1="296" y1="84" x2="296" y2="160" class="line"/>

  <!-- Περιθώρια -->
  <rect x="40" y="88" width="25" height="31" fill="#fff" stroke="#222"/>
  <line x1="46" y1="88" x2="46" y2="119" stroke="#3b88d9" stroke-width="2"/>
  <line x1="59" y1="88" x2="59" y2="119" stroke="#3b88d9" stroke-width="2"/>
  <line x1="40" y1="96" x2="65" y2="96" stroke="#3b88d9" stroke-width="2"/>
  <line x1="40" y1="112" x2="65" y2="112" stroke="#3b88d9" stroke-width="2"/>
  <text x="21" y="136" class="ui label">Περιθώρια</text>
  <text x="52" y="154" class="drop">⌄</text>

  <!-- Προσανατολισμός -->
  <rect x="122" y="90" width="25" height="26" fill="#fff" stroke="#222"/>
  <path d="M130 90 L130 83 L153 83 L153 109 L147 109" fill="#fff" stroke="#222"/>
  <line x1="130" y1="91" x2="146" y2="107" stroke="#777"/>
  <text x="91" y="136" class="ui label">Προσανατολισμός</text>
  <text x="137" y="154" class="drop">⌄</text>

  <!-- Μέγεθος -->
  <rect x="209" y="88" width="25" height="31" fill="#fff" stroke="#222"/>
  <line x1="214" y1="95" x2="229" y2="95" stroke="#3b88d9" stroke-width="2"/>
  <line x1="214" y1="102" x2="229" y2="102" stroke="#3b88d9" stroke-width="2"/>
  <line x1="214" y1="109" x2="229" y2="109" stroke="#3b88d9" stroke-width="2"/>
  <text x="196" y="136" class="ui label">Μέγεθος</text>
  <text x="220" y="154" class="drop">⌄</text>

  <!-- Στήλες -->
  <rect x="262" y="90" width="22" height="28" fill="#fff" stroke="#3b88d9"/>
  <line x1="269" y1="92" x2="269" y2="116" stroke="#3b88d9"/>
  <line x1="276" y1="92" x2="276" y2="116" stroke="#3b88d9"/>
  <text x="254" y="136" class="ui label">Στήλες</text>
  <text x="271" y="154" class="drop">⌄</text>

  <!-- δεξιές επιλογές -->
  <text x="309" y="97" class="ui small">↔ Αλλαγές</text>
  <text x="309" y="124" class="ui small">1·2 Αρίθμηση γραμμών⌄</text>
  <text x="309" y="151" class="ui small">aβ Συλλαβισμός⌄</text>

  <text x="165" y="184" class="ui group">Διαμόρφωση σελίδας</text>
  <path d="M439 168 h7 v7" stroke="#444" fill="none"/>
</svg>
